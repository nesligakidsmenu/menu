<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kategori</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header class="header">

    <button class="geriBtn" onclick="history.back()">
        ← Geri
    </button>

    <img src="./images/logo.png" class="logo" alt="Logo">

    <h2 id="sayfaBaslik"></h2>

</header>

<div class="container">

    <!--
        Rev6
        Ürün kartları artık script.js tarafından
        premium accordion olarak oluşturulacaktır.
    -->

    <section class="kategori-page">

        <div id="kategoriListesi" class="premium-list"></div>

    </section>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const kat = params.get("kat");
const alt = params.get("alt");

const baslik = document.getElementById("sayfaBaslik");

const isimler = {

    kahveler:"☕ Kahveler",

    tatlilar:"🍰 Tatlılar",

    "soguk-special":"🥤 Soğuk Special İçecekler",

    caylar:"🍵 Çaylar",

    "sicak-icecekler":"🔥 Sıcak İçecekler",

    yiyecekler:"🍽️ Yiyecekler",

    cocuk:"🧒 Çocuk Dünyası",

    "soguk-icecekler":"🥤 Soğuk İçecekler"

};

if(!alt){

    baslik.innerHTML = isimler[kat] || "";

}else{

    const altlar = {

        "espresso-bazli":"☕ Espresso Bazlı Kahveler",

        "sutlu":"🥛 Sütlü Kahveler",

        "soguk":"🧊 Soğuk Kahveler",

        "geleneksel":"🇹🇷 Geleneksel Kahveler",

        "waffle":"🧇 Waffle",

        "tatlilar":"🍰 Diğer Tatlılar",

        "milkshake":"🥤 Milkshake",

        "frappe":"☕ Frappe",

        "smoothie":"🥭 Smoothie",

        "frozen":"❄️ Frozen",

        "cay":"🍵 Çaylar",

        "sicak":"☕ Sıcak İçecekler",

        "cocuk-menu":"🍽️ Çocuk Menüleri",

        "cocuk-icecek":"🥛 Çocuk İçecekleri"

    };

    baslik.innerHTML = altlar[alt] || "";

}

</script>

<script src="script.js"></script>

<nav class="bottom-nav">

<a href="index.html#arama"><span>🔍</span><span>Ara</span></a>
</nav>

</body>
</html>
